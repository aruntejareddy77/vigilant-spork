[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-workbench"
version = "0.1.0"
description = "Sovereign AI Workbench - Self-Hosted Air-Gapped Industrial AI Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sovereign AI Team" }
]
dependencies = [
    "rfc8785>=0.1.4",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0.0",
    "portalocker>=2.8.0",
    "Pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "click>=8.1.0",
    "pypdf>=4.0.0",
    "pytesseract>=0.3.10",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "python-pptx>=0.6.23",
]

[project.scripts]
sovereign = "sovereign.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
